
name: Coverage Checker CI

on:
  push:
    branches: [ "main", "hw4" ]
  pull_request:
    branches: [ "main", "hw4" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      
      - name: Install Z3
        run: sudo apt-get update && sudo apt-get install -y libz3-dev

      - name: Build
        run: make build

  coverage-checker:
      needs: build
      runs-on: ubuntu-latest
      permissions:
        contents: read
      
      env:
        FILE_PATH: "./homework3/examples/test_functions.go"

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version-file: go.mod
            cache: true
        
        - name: Install Z3
          run: sudo apt-get update && sudo apt-get install -y libz3-dev

        - name: Build coverage checker
          run: go build -o homework5/coverage_checker ./homework5/coverage_checker.go

        - name: Run coverage_checker on file ${{ env.FILE_PATH }}
          run: ./coverage_checker "$FILE_NAME" > coverage_output.txt 2>&1

        - name: Upload build reports
          uses: actions/upload-artifact@v4
          with:
            name: coverage-checker-report
            path: coverage_output.txt
  
  make-coverage:
      needs: coverage-checker
      runs-on: ubuntu-latest
      permissions:
        contents: read

      steps:
        - name: Checkout repository
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version-file: go.mod
            cache: true
        
        - name: Install Z3
          run: sudo apt-get update && sudo apt-get install -y libz3-dev

        - name: Make coverage
          run: make coverage

        - name: Upload build reports
          uses: actions/upload-artifact@v4
          with:
            name: make-coverage-report
            path: coverage.html